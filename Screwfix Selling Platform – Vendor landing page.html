  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tion: column; gap: 12px; max-width: 720px\">\n<span style=\"color: {{blue}}; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 14px\">How it works<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Barlow Condensed', Barlow, Arial, sans-serif; font-weight: 800; font-size: 48px; line-height: 1.05; text-transform: uppercase\">From interest to first order in four steps<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px\">\n<div style=\"background: #ffffff; border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 12px; border-top: 6px solid {{blue}}\">\n<span style=\"font-family: 'Barlow Condensed', Barlow, Arial, sans-serif; font-size: 48px; font-weight: 800; color: {{blue}}; line-height: 1\">01<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700\">Register interest<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5868\">Tell us about your business, your range and how you’d like to sell. It takes about five minutes.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 12px; border-top: 6px solid {{blue}}\">\n<span style=\"font-family: 'Barlow Condensed', Barlow, Arial, sans-serif; font-size: 48px; font-weight: 800; color: {{blue}}; line-height: 1\">02<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700\">Review and approval<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5868\">Our category team reviews fit with the Screwfix range and gets in touch within [X] working days to talk next steps.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 12px; border-top: 6px solid {{blue}}\">\n<span style=\"font-family: 'Barlow Condensed', Barlow, Arial, sans-serif; font-size: 48px; font-weight: 800; c amed account manager<\u002Fli>\n<li>Brand store and campaign support<\u002Fli>\n<li>Joint business planning<\u002Fli>\n<\u002Ful>\n<a href=\"#register\" sc-camel-on-click=\"{{ pickBrand }}\" style=\"margin-top: auto; text-align: center; background: {{blue}}; color: #ffffff; text-decoration: none; font-weight: 700; padding: 14px; border-radius: 6px\">Register for this option<\u002Fa>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Categories -->\n<section aria-labelledby=\"cats\" style=\"background: #0B1F33; color: #ffffff\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 64px 24px; display: flex; flex-direction: column; gap: 24px\">\n<h2 id=\"cats\" style=\"margin: 0; font-family: 'Barlow Condensed', Barlow, Arial, sans-serif; font-weight: 800; font-size: 40px; text-transform: uppercase\">Categories we’re looking to grow<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<span style=\"border: 2px solid {{red}}; color: #ffffff; font-weight: 600; padding: 10px 18px; border-radius: 999px\">Power tools and accessories<\u002Fspan>\n<span style=\"border: 2px solid {{red}}; color: #ffffff; font-weight: 600; padding: 10px 18px; border-radius: 999px\">Hand tools<\u002Fspan>\n<span style=\"border: 2px solid {{red}}; color: #ffffff; font-weight: 600; padding: 10px 18px; border-radius: 999px\">Workwear and PPE<\u002Fspan>\n<span style=\"border: 2px solid {{red}}; color: #ffffff; font-weight: 600; padding: 10px 18px; border-radius: 999px\">Plumbing and heating<\u002Fspan>\n<span style=\"border: 2px solid {{red}}; color: #ffffff; font-weight: 600; padding: 10px 18px; border-radius: 999px\">Electrical and lighting<\u002Fspan>\n<span style=\"border: 2px solid {{red}}; color: #ffffff; font-weight: 600; padding: 10px 18px; border-radius: 999px\">Bathrooms and kitchens<\u002Fspan>\n<span style=\"border: 2px solid {{red}}; color: #ffffff; font-weight: 600; padding: 10px 18px; border-radius: 999px\">Outdoor and garden<\u002Fspan>\n<span style=\"border: 2px solid {{red}}; color: #ffffff; font-weight: 600; padding: 10px 18px; border-radius: 999px\">Security and safety<\u002Fspan>\n<span style=\"border: 2px solid {{red}}; color: #ffffff; font-weight: 600; padding: 10px 18px; border-radius: 999px\">Building and landscaping<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Register -->\n<section id=\"register\" style=\"background: #F3F5F8\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start\">\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<span style=\"color: {{blue}}; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 14px\">Register interest<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Barlow Condensed', Barlow, Arial, sans-serif; font-weight: 800; font-size: 48px; line-height: 1.05; text-transform: uppercase\">Let’s talk about your range<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A5868\">Registering interest doesn’t commit you to anything. A member of our vendor team will review your details and contact you to discuss the best fit.<\u002Fp>\n<div style=\"background: #ffffff; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px\">\n<strong style=\"font-size: 17px\">What happens next<\u002Fstrong>\n<span>1. We acknowledge your registration by email<\u002Fspan>\n<span>2. Our category team reviews your range<\u002Fspan>\n<span>3. We arrange a call within [X] working days<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 999 1 560px; min-width: 0; background: #ffffff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 16px rgba(11,31,51,0.08)\">\n<sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 16px; padding: 24px 0\">\n<span style=\"width: 64px; height: 64px; border-radius: 50%; background: #E8F3EA; color: #1E5E2C; display: flex; align-items: center; justify-content: center\"><svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Barlow Condensed', Barlow, Arial, sans-serif; font-weight: 800; font-size: 36px; text-transform: uppercase\">Thanks, {{ contactFirst }}<\u002Fh3>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A5868\">We’ve received your interest for {{ companyName }}. You’ll get a confirmation at {{ emailAddr }} and our vendor team will be in touch within [X] working days.<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"background: transparent; border: 2px solid {{blue}}; color: {{blue}}; font-weight: 700; font-size: 16px; padding: 12px 20px; border-radius: 6px; cursor: pointer; min-height: 44px\">Register another business<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px\">\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px\">Company name *\n<input type=\"text\" value=\"{{ company }}\" sc-camel-on-change=\"{{ onCompany }}\" autocomplete=\"organization\" style=\"border: 1px solid #8A97A6; border-radius: 6px; padding: 12px; font-size: 16px; min-height: 44px; box-sizing: border-box; font-weight: 400\">\n<\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px\">Your name *\n<input type=\"text\" value=\"{{ contact }}\" sc-camel-on-change=\"{{ onContact }}\" autocomplete=\"name\" style=\"border: 1px solid #8A97A6; border-radius: 6px; padding: 12px; font-size: 16px; min-height: 44px; box-sizing: border-box; font-weight: 400\">\n<\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px\">Work email *\n<input type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" autocomplete=\"email\" style=\"border: 1px solid #8A97A6; border-radius: 6px; padding: 12px; font-size: 16px; min-height: 44px; box-sizing: border-box; font-weight: 400\">\n<\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px\">Phone\n<input type=\"tel\" value=\"{{ phone }}\" sc-camel-on-change=\"{{ onPhone }}\" autocomplete=\"tel\" style=\"border: 1px solid #8A97A6; border-radius: 6px; padding: 12px; font-size: 16px; min-height: 44px; box-sizing: border-box; font-weight: 400\">\n<\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px\">Website\n<input type=\"url\" value=\"{{ website }}\" sc-camel-on-change=\"{{ onWebsite }}\" placeholder=\"https://\" style=\"border: 1px solid #8A97A6; border-radius: 6px; padding: 12px; font-size: 16px; min-height: 44px; box-sizing: border-box; font-weight: 400\">\n<\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px\">Main product category\n<sc-raw-select value=\"{{ category }}\" sc-camel-on-change=\"{{ onCategory }}\" style=\"border: 1px solid #8A97A6; border-radius: 6px; padding: 12px; font-size: 16px; min-height: 44px; box-sizing: border-box; background: #ffffff; font-weight: 400\">\n<option value=\"\">Select a category<\u002Foption>\n<option>Power tools and accessories<\u002Foption>\n<option>Hand tools<\u002Foption>\n<option>Workwear and PPE<\u002Foption>\n<option>Plumbing and heating<\u002Foption>\n<option>Electrical and lighting<\u002Foption>\n<option>Bathrooms and kitchens<\u002Foption>\n<option>Outdoor and garden<\u002Foption>\n<option>Security and safety<\u002Foption>\n<option>Building and landscaping<\u002Foption>\n<option>Other<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px\">Number of products (SKUs)\n<sc-raw-select value=\"{{ skus }}\" sc-camel-on-change=\"{{ onSkus }}\" style=\"border: 1px solid #8A97A6; border-radius: 6px; padding: 12px; font-size: 16px; min-height: 44px; box-sizing: border-box; background: #ffffff; font-weight: 400\">\n<option value=\"\">Select a range size<\u002Foption>\n<option>Fewer than 50<\u002Foption>\n<option>50 to 250<\u002Foption>\n<option>250 to 1,000<\u002Foption>\n<option>More than 1,000<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px\">Annual UK turnover\n<sc-raw-select value=\"{{ turnover }}\" sc-camel-on-change=\"{{ onTurnover }}\" style=\"border: 1px solid #8A97A6; border-radius: 6px; padding: 12px; font-size: 16px; min-height: 44px; box-sizing: border-box; background: #ffffff; font-weight: 400\">\n<option value=\"\">Select a band<\u002Foption>\n<option>Under £1m<\u002Foption>\n<option>£1m to £10m<\u002Foption>\n<option>£10m to £50m<\u002Foption>\n<option>Over £50m<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Flabel>\n<\u002Fdiv>\n\n<fieldset style=\"border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px\">\n<legend style=\"font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 10px\">Preferred way to sell<\u002Flegend>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px\">\n<sc-for list=\"{{ options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n<label style=\"{{ opt.boxStyle }}\">\n<input type=\"radio\" name=\"sellOption\" checked=\"{{ opt.checked }}\" sc-camel-on-change=\"{{ opt.pick }}\" style=\"width: 20px; height: 20px; accent-color: #0057A3; margin: 0\">\n<span>{{ opt.label }}<\u002Fspan>\n<\u002Flabel>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Ffieldset>\n\n<fieldset style=\"border: 0; padding: 0; margin: 0\">\n<legend style=\"font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 10px\">Your current capabilities<\u002Flegend>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px\">\n<sc-for list=\"{{ caps }}\" as=\"cap\" hint-placeholder-count=\"4\">\n<label style=\"display: flex; align-items: center; gap: 10px; font-size: 16px; min-height: 44px\">\n<input type=\"checkbox\" checked=\"{{ cap.checked }}\" sc-camel-on-change=\"{{ cap.toggle }}\" style=\"width: 20px; height: 20px; accent-color: #0057A3; margin: 0\">\n<span>{{ cap.label }}<\u002Fspan>\n<\u002Flabel>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Ffieldset>\n\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px\">Tell us about your range\n<textarea value=\"{{ message }}\" sc-camel-on-change=\"{{ onMessage }}\" rows=\"4\" style=\"border: 1px solid #8A97A6; border-radius: 6px; padding: 12px; font-size: 16px; box-sizing: border-box; resize: vertical; font-weight: 400\"><\u002Ftextarea>\n<\u002Flabel>\n\n<label style=\"display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 1.5\">\n<input type=\"checkbox\" checked=\"{{ consent }}\" sc-camel-on-change=\"{{ onConsent }}\" style=\"width: 20px; height: 20px; accent-color: #0057A3; margin: 2px 0 0; flex: none\">\n<span>I agree to Screwfix contacting me about the Selling Platform, and to my details being handled in line with the <a href=\"#[privacy-notice]\">privacy notice<\u002Fa>. *<\u002Fspan>\n<\u002Flabel>\n\n<sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n<p role=\"alert\" style=\"margin: 0; background: #FDECEC; color: #8A1C1C; font-weight: 600; padding: 12px 16px; border-radius: 6px\">{{ error }}<\u002Fp>\n<\u002Fsc-if>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px\">\n<button type=\"button\" sc-camel-on-click=\"{{ submit }}\" style=\"background: {{red}}; color: #ffffff; border: 0; font-weight: 700; font-size: 18px; padding: 16px 32px; border-radius: 6px; cursor: pointer; min-height: 52px\">Register interest<\u002Fbutton>\n<span style=\"font-size: 14px; color: #4A5868\">* Required<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"faq\" style=\"background: #ffffff\">\n<div style=\"max-width: 880px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px\">\n<h2 style=\"margin: 0; font-family: 'Barlow Condensed', Barlow, Arial, sans-serif; font-weight: 800; font-size: 48px; line-height: 1.05; text-transform: uppercase\">Frequently asked questions<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; border-top: 1px solid #DCE3EC\">\n<sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"5\">\n<div style=\"border-bottom: 1px solid #DCE3EC\">\n<button type=\"button\" sc-camel-on-click=\"{{ q.toggle }}\" aria-expanded=\"{{ q.expanded }}\" style=\"width: 100%; background: transparent; border: 0; padding: 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left; font-family: inherit; font-size: 19px; font-weight: 700; color: #1B2733; cursor: pointer; min-height: 44px\">\n<span>{{ q.question }}<\u002Fspan>\n<span aria-hidden=\"true\" style=\"flex: none; width: 32px; height: 32px; border-radius: 50%; background: #E6EEF7; color: #0057A3; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700\">{{ q.sign }}<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{ q.open }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0 0 20px; font-size: 17px; line-height: 1.6; color: #4A5868; max-width: 720px\">{{ q.answer }}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Final CTA -->\n<section style=\"background: {{red}}; color: #ffffff\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 56px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px\">\n<h2 style=\"margin: 0; font-family: 'Barlow Condensed', Barlow, Arial, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.05; text-transform: uppercase; max-width: 680px\">Ready to sell to the trade with Screwfix?<\u002Fh2>\n<a href=\"#register\" style=\"background: #0B1F33; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 18px; padding: 16px 28px; border-radius: 6px\">Register your interest<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Footer -->\n<footer style=\"background: #0B1F33; color: #C9D3DE; font-size: 15px\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 40px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<span style=\"align-self: flex-start; background: #ffffff; padding: 10px 14px; border-radius: 6px; display: flex\"><img src=\"31cf5b84-3968-4e77-944d-f37c901ef0dd\" alt=\"Screwfix\" style=\"height: 32px; width: auto; display: block\"><\u002Fspan>\n<span>Screwfix Direct Limited, part of the Kingfisher group.<\u002Fspan>\n<\u002Fdiv>\n<nav aria-label=\"Footer\" style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center\">\n<a href=\"#[privacy-notice]\" style=\"color: #ffffff\">Privacy notice<\u002Fa>\n<a href=\"#[vendor-terms]\" style=\"color: #ffffff\">Vendor terms<\u002Fa>\n<a href=\"#[cookies]\" style=\"color: #ffffff\">Cookies<\u002Fa>\n<a href=\"mailto:[sellingplatform@screwfix.com]\" style=\"color: #ffffff\">Contact the vendor team<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;blue&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0053A1&quot;,&quot;options&quot;:[&quot;#0053A1&quot;,&quot;#004B8D&quot;,&quot;#0A3D73&quot;],&quot;section&quot;:&quot;Brand&quot;},&quot;red&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D6001C&quot;,&quot;options&quot;:[&quot;#D6001C&quot;,&quot;#ED1B24&quot;,&quot;#B00020&quot;],&quot;section&quot;:&quot;Brand&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5600}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      company: '', contact: '', email: '', phone: '', website: '',\n      category: '', skus: '', turnover: '', message: '',\n      option: '', consent: false,\n      caps: { stock: false, ship: false, store: false, edi: false, data: false },\n      submitted: false, error: '', openFaq: -1\n    };\n  }\n  field(name) {\n    return (e) => this.setState({ [name]: e.target.value, error: '' });\n  }\n  pick(option) {\n    return () => this.setState({ option: option, error: '' });\n  }\n  submit() {\n    const s = this.state;\n    if (!s.company.trim() || !s.contact.trim() || !s.email.trim()) {\n      this.setState({ error: 'Please fill in your company name, your name and your work email.' });\n      return;\n    }\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(s.email.trim())) {\n      this.setState({ error: 'Please enter a valid email address.' });\n      return;\n    }\n    if (!s.consent) {\n      this.setState({ error: 'Please confirm you’re happy for us to contact you.' });\n      return;\n    }\n    this.setState({ submitted: true, error: '' });\n  }\n  renderVals() {\n    const s = this.state;\n    const blue = this.props.blue ?? '#0053A1';\n    const red = this.props.red ?? '#D6001C';\n    const optList = ['Partner Fulfilled', 'Fulfilled by Screwfix', 'Brand Partner', 'Not sure yet'];\n    const options = optList.map((label) => {\n      const checked = s.option === label;\n      return {\n        label: label,\n        checked: checked,\n        pick: this.pick(label),\n        boxStyle: 'display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; padding: 12px 14px; min-height: 44px; box-sizing: border-box; border-radius: 8px; cursor: pointer; border: 2px solid ' + (checked ? blue : '#C4CDD8') + '; background: ' + (checked ? '#E6EEF7' : '#ffffff')\n      };\n    });\n    const capLabels = {\n      stock: 'I hold UK stock',\n      ship: 'I can deliver direct to customers’ homes (VTH)',\n      store: 'I can deliver to Screwfix stores (VTS)',\n      edi: 'I can send stock and order feeds (API or EDI)',\n      data: 'I have product data and imagery ready'\n    };\n    const caps = Object.keys(capLabels).map((k) => ({\n      label: capLabels[k],\n      checked: s.caps[k],\n      toggle: () => this.setState({ caps: Object.assign({}, s.caps, { [k]: !s.caps[k] }) })\n    }));\n    const faqData = [\n      { question: 'Who can apply to sell on the platform?', answer: 'UK and international brands, manufacturers and distributors with products that suit trade and DIY customers. We review every application for range fit, quality and service capability.' },\n      { question: 'What does it cost?', answer: 'Fees depend on the partnership option and category. Partner Fulfilled and Fulfilled by Screwfix (FBS) use a commission model from [X]%; Brand Partner terms are agreed individually. There is [no / a £X] set-up fee.' },\n      { question: 'How and when do I get paid?', answer: 'Screwfix collects payment from the customer and settles to your account every [X] days, minus agreed fees. Statements are available in the vendor portal.' },\n      { question: 'Who handles customer service and returns?', answer: 'Screwfix is the customer’s first point of contact. For Partner Fulfilled orders, you handle dispatch (to home or store) and approved returns within agreed service levels; with Fulfilled by Screwfix (FBS) we manage both from your consignment stock.' },\n      { question: 'How long does onboarding take?', answer: 'Typically [X] to [X] weeks from approval to your first products going live, depending on how quickly product data and feeds are ready.' }\n    ];\n    const faqs = faqData.map((f, i) => {\n      const open = s.openFaq === i;\n      return Object.assign({}, f, {\n        open: open,\n        expanded: open ? 'true' : 'false',\n        sign: open ? '−' : '+',\n        toggle: () => this.setState({ openFaq: open ? -1 : i })\n      });\n    });\n    return {\n      blue: blue,\n      red: red,\n      company: s.company, contact: s.contact, email: s.email, phone: s.phone,\n      website: s.website, category: s.category, skus: s.skus, turnover: s.turnover,\n      message: s.message, consent: s.consent,\n      onCompany: this.field('company'), onContact: this.field('contact'),\n      onEmail: this.field('email'), onPhone: this.field('phone'),\n      onWebsite: this.field('website'), onCategory: this.field('category'),\n      onSkus: this.field('skus'), onTurnover: this.field('turnover'),\n      onMessage: this.field('message'),\n      onConsent: () => this.setState({ consent: !s.consent, error: '' }),\n      options: options,\n      caps: caps,\n      pickMarketplace: this.pick('Partner Fulfilled'),\n      pickFulfilled: this.pick('Fulfilled by Screwfix'),\n      pickBrand: this.pick('Brand Partner'),\n      submit: () => this.submit(),\n      reset: () => this.setState({\n        company: '', contact: '', email: '', phone: '', website: '',\n        category: '', skus: '', turnover: '', message: '', option: '', consent: false,\n        caps: { stock: false, ship: false, store: false, edi: false, data: false },\n        submitted: false, error: ''\n      }),\n      submitted: s.submitted,\n      notSubmitted: !s.submitted,\n      hasError: !!s.error,\n      error: s.error,\n      contactFirst: (s.contact.trim().split(' ')[0]) || 'there',\n      companyName: s.company.trim(),\n      emailAddr: s.email.trim(),\n      faqs: faqs\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
